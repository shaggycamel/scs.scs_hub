[project]
name = "scs-hub"
version = "0.1.0"
description = "NBA / fantasy / statyx data hub, unified through a shared database connection layer"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy",
    "polars",
    "pyjanitor==0.30.0",
    "requests",
    "python-dateutil",
    "tabula-py",
    "nba_api",
    "nbainjuries",
    "espn_api",
    "aiohttp",
    "janitor",
    "pandas",
    "sqlalchemy-cockroachdb>=2.0.4",
    "psycopg2>=2.9.12",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scs_hub"]
